user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log info;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    upstream app {
        server django:8000;
    }

    upstream graphql {
        server graphql_engine:8080;
    }

    upstream collab {
        server collab-server:8000;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # 100M rejected a real-world 237MB Nexpose scan XML at the proxy
        # layer before it ever reached Django (Nexpose XML uploads are now
        # processed asynchronously via django-q -- see rolodex/tasks.py --
        # so raising this no longer risks pinning a web worker on a huge
        # synchronous parse the way it would have before that change).
        client_max_body_size 500M;
        client_body_timeout 300s;
        proxy_headers_hash_max_size 1024;
        proxy_headers_hash_bucket_size 128;
        server_name ghostwriter.local;
        charset utf-8;
        resolver 8.8.8.8;

        include nginx_common.conf;
    }
}
